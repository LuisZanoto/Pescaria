<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b17">
  <meta name="description" content="Teste de navegação no rio com controle por setas.">
  <title>Teste de navegação | Pescaria</title>
  <link rel="stylesheet" href="css/game.css">
  <script src="js/game.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PESCARIA · TESTE DE NAVEGAÇÃO</p>
        <h1>Rio <span>Mogi</span></h1>
      </div>
      <p class="speed-readout">VELOCIDADE <strong id="speed">0 km/h</strong></p>
    </header>

    <section class="river-view" aria-label="Área de navegação">
      <canvas id="river" aria-label="Mapa do rio com a posição da canoa"></canvas>
      <section id="overlay" class="overlay" aria-labelledby="overlay-title">
        <div class="dialog">
          <p class="eyebrow">PERCURSO ESTIMADO · 15 KM</p>
          <h2 id="overlay-title">Pronto para navegar?</h2>
          <p id="overlay-copy">Use as setas para acelerar, frear e virar. A navegação é livre, sem limite de tempo, com velocidade máxima de 100 km/h.</p>
          <button id="start-button" type="button" disabled>CARREGANDO MAPA...</button>
        </div>
      </section>
    </section>

    <footer class="bottom-bar">
      <p class="controls-copy"><span class="eyebrow">CONTROLES</span> <kbd>↑</kbd> acelerar <kbd>↓</kbd> frear <kbd>←</kbd> <kbd>→</kbd> virar</p>
    </footer>
  </main>
</body>
</html>
